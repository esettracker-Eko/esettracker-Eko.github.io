<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差旅记账PWA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase UMD CDN，无module问题 -->

</head>
<body class="m-0 p-0">
  <div id="app"></div>
  <div id="modal"></div>
<script>
    <script>
  // 全局状态
  const state = {
    currentPage: 'home',
    records: [],
    deletedRecords: [],
    assets: [],
    currencies: [],
    isOnline: navigator.onLine
  };

  // IndexedDB 封装
  const dbName = 'travelBillDB';
  const storeName = 'mainStore';
  let idb;

  function openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(dbName, 1);
      req.onupgradeneeded = e => {
        idb = e.target.result;
        idb.createObjectStore(storeName);
      };
      req.onsuccess = e => {
        idb = e.target.result;
        res(idb);
      };
      req.onerror = e => rej(e.target.error);
    });
  }

  async function idbSave(key, data) {
    await openDB();
    const tx = idb.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(data, key);
  }

  async function idbLoad(key) {
    await openDB();
    const tx = idb.transaction(storeName, 'readonly');
    return tx.objectStore(storeName).get(key);
  }

  async function saveAllLocal() {
    await idbSave('records', state.records);
    await idbSave('deletedRecords', state.deletedRecords);
    await idbSave('assets', state.assets);
    await idbSave('currencies', state.currencies);
  }

  async function loadAllLocal() {
    state.records = await idbLoad('records') || [];
    state.deletedRecords = await idbLoad('deletedRecords') || [];
    state.assets = await idbLoad('assets') || [];
    state.currencies = await idbLoad('currencies') || [{ code: 'CNY', rate: 1, isDefault: true }];
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  async function saveData() {
    await saveAllLocal();
  }

  // 页面渲染入口
  function render() {
    const app = document.getElementById('app');
    if (!app) return;

    if (state.currentPage === 'home') renderHome(app);
    else if (state.currentPage === 'calendar') renderCalendar(app);
    else if (state.currentPage === 'asset') renderAsset(app);
    else if (state.currentPage === 'setting') renderSetting(app);
  }

  // 首页
  function renderHome(app) {
    const travelAssets = state.assets.filter(a => a.type === 'travel');
    const activityAssets = state.assets.filter(a => a.type === 'activity');

    const travelTotal = travelAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
    const travelSpend = state.records.filter(r => r.assetType === 'travel' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
    const travelRemain = travelTotal - travelSpend;

    const actTotal = activityAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
    const actSpend = state.records.filter(r => r.assetType === 'activity' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
    const actRemain = actTotal - actSpend;

    const allRecords = [...state.records].sort((a, b) => new Date(b.time) - new Date(a.time));

    app.innerHTML = `
      <div class="h-screen flex flex-col">
        <div class="flex-1 flex flex-col">
          <div class="h-[20%] p-2 border-b">
            <div class="flex justify-between items-center">
              <h2 class="text-lg font-bold">首页</h2>
              <button onclick="showAllRecords()" class="text-blue-600">所有明细</button>
            </div>
          </div>
          <div class="h-[60%] p-2 overflow-auto border-b">
            <h3 class="font-semibold mb-2">收支明细</h3>
            <div id="recordList" class="space-y-1">
              ${allRecords.slice(0, 8).map(r => `
                <div class="flex justify-between border p-1 rounded">
                  <div>${r.time} ${r.type === 'expense' ? '-' : '+'}${Number(r.rmbAmount).toFixed(2)}元 ${r.category} ${r.note || ''}</div>
                  <div class="space-x-2">
                    <button onclick="editRecord('${r.id}')" class="text-blue-500">修改</button>
                    <button onclick="delRecord('${r.id}')" class="text-red-500">删除</button>
                  </div>
                </div>`).join('')}
            </div>
            <div class="mt-2 text-right">
              <button onclick="showRecycleBin()" class="text-orange-600">删除记录（回收站）</button>
            </div>
          </div>
          <div class="h-[20%] p-2">
            <button onclick="openBillPage()" class="w-full bg-blue-500 text-white py-2 rounded mb-2">开始记账</button>
            <div class="grid grid-cols-2 gap-2">
              <div class="border p-2 rounded">
                <div class="text-sm font-semibold mb-1">差旅资产</div>
                <div>总额：${travelTotal.toFixed(2)} RMB</div>
                <div>已支出：${travelSpend.toFixed(2)} RMB</div>
                <div>剩余：${travelRemain.toFixed(2)} RMB</div>
              </div>
              <div class="border p-2 rounded">
                <div class="text-sm font-semibold mb-1">活动资产</div>
                <div>总额：${actTotal.toFixed(2)} RMB</div>
                <div>已支出：${actSpend.toFixed(2)} RMB</div>
                <div>剩余：${actRemain.toFixed(2)} RMB</div>
              </div>
            </div>
          </div>
        </div>
        <div class="flex border-t">
          <button onclick="switchPage('home')" class="flex-1 py-3 ${state.currentPage === 'home' ? 'bg-blue-100' : ''}">首页</button>
          <button onclick="switchPage('calendar')" class="flex-1 py-3 ${state.currentPage === 'calendar' ? 'bg-blue-100' : ''}">日历</button>
          <button onclick="switchPage('asset')" class="flex-1 py-3 ${state.currentPage === 'asset' ? 'bg-blue-100' : ''}">资产</button>
          <button onclick="switchPage('setting')" class="flex-1 py-3 ${state.currentPage === 'setting' ? 'bg-blue-100' : ''}">设置</button>
        </div>
      </div>`;
  }

  function switchPage(page) {
    state.currentPage = page;
    render();
  }

  // 记账弹窗
  function openBillPage() {
    const defaultCurrency = state.currencies.find(c => c.isDefault) || state.currencies[0];
    const assetTypes = state.assets.map(a => `<option value="${a.type}">${a.name || a.type}</option>`).join('');
    const currencyOpts = state.currencies.map(c => `<option value="${c.code}" data-rate="${c.rate}">${c.code}</option>`).join('');

    const catOpts = `
      <option value="交通-飞机">交通-飞机</option>
      <option value="交通-火车">交通-火车</option>
      <option value="交通-出租">交通-出租</option>
      <option value="交通-租车">交通-租车</option>
      <option value="交通-停车费">交通-停车费</option>
      <option value="交通-公共交通">交通-公共交通</option>
      <option value="交通-加油">交通-加油</option>
      <option value="住宿">住宿</option>
      <option value="餐饮-早餐">餐饮-早餐</option>
      <option value="餐饮-中餐">餐饮-中餐</option>
      <option value="餐饮-晚餐">餐饮-晚餐</option>
      <option value="餐饮-夜宵">餐饮-夜宵</option>
      <option value="餐饮-咖啡饮品">餐饮-咖啡饮品</option>
      <option value="招待-餐饮">招待-餐饮</option>
      <option value="招待-娱乐">招待-娱乐</option>
      <option value="招待-礼物">招待-礼物</option>
      <option value="招待-其他">招待-其他</option>
      <option value="通讯-话费">通讯-话费</option>
      <option value="通讯-网络">通讯-网络</option>
      <option value="其他">其他</option>`;

    const html = `
      <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded p-4">
          <div class="flex gap-2 mb-3">
            <label class="flex items-center"><input type="radio" name="billType" value="expense" checked>支出</label>
            <label class="flex items-center"><input type="radio" name="billType" value="income">收入</label>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-3">
            <input type="number" id="billAmount" placeholder="金额" class="border p-2">
            <select id="billAssetType" class="border p-2">${assetTypes || '<option value="travel">差旅资产</option>'}</select>
            <select id="billCurrency" class="border p-2" onchange="calcRmb()">${currencyOpts}</select>
          </div>
          <div class="text-sm text-gray-500 mb-3">换算RMB：<span id="rmbPreview">0</span></div>
          <select id="billCategory" class="border p-2 w-full mb-3">${catOpts}</select>
          <textarea id="billNote" placeholder="备注" class="border p-2 w-full mb-3"></textarea>
          <div class="flex gap-2">
            <button onclick="submitBill()" class="flex-1 bg-blue-500 text-white py-2 rounded">保存</button>
            <button onclick="closeBillModal()" class="flex-1 bg-gray-400 text-white py-2 rounded">取消</button>
          </div>
        </div>
      </div>`;

    document.getElementById('modal').innerHTML = html;
  }

  function calcRmb() {
    const amount = Number(document.getElementById('billAmount').value || 0);
    const currSel = document.getElementById('billCurrency');
    const rate = Number(currSel.options[currSel.selectedIndex].dataset.rate);
    document.getElementById('rmbPreview').textContent = (amount * rate).toFixed(2);
  }

  async function submitBill() {
    const type = document.querySelector('input[name="billType"]:checked').value;
    const amount = Number(document.getElementById('billAmount').value);
    const assetType = document.getElementById('billAssetType').value;
    const currency = document.getElementById('billCurrency').value;
    const category = document.getElementById('billCategory').value;
    const note = document.getElementById('billNote').value;

    const currItem = state.currencies.find(c => c.code === currency);
    const rmbAmount = amount * currItem.rate;

    const rec = {
      id: genId(),
      time: new Date().toLocaleString(),
      type,
      amount,
      currency,
      rmbAmount,
      assetType,
      category,
      note
    };

    state.records.push(rec);
    await saveData();
    closeBillModal();
    render();
  }

  function closeBillModal() {
    document.getElementById('modal').innerHTML = '';
  }

  async function delRecord(id) {
    const idx = state.records.findIndex(r => r.id === id);
    if (idx === -1) return;
    const item = state.records.splice(idx, 1)[0];
    state.deletedRecords.push(item);
    await saveData();
    render();
  }

  function editRecord(id) {
    alert('编辑功能暂未开放');
  }

  function showAllRecords() {
    const all = [...state.records].sort((a, b) => new Date(b.time) - new Date(a.time));
    let html = `<div class="fixed inset-0 bg-black/50 p-4 overflow-auto"><div class="bg-white rounded p-4">
      <h2 class="font-bold text-lg mb-2">全部明细 <button onclick="closeModal()" class="float-right">关闭</button></h2>
      ${all.map(r => `<div class="border p-1 my-1">${r.time} ${r.type} ${Number(r.rmbAmount).toFixed(2)}元 ${r.category} ${r.note || ''}</div>`).join('')}</div></div>`;
    document.getElementById('modal').innerHTML = html;
  }

  function showRecycleBin() {
    const list = state.deletedRecords;
    let html = `<div class="fixed inset-0 bg-black/50 p-4 overflow-auto"><div class="bg-white rounded p-4">
      <h2 class="font-bold text-lg mb-2">回收站 <button onclick="closeModal()" class="float-right">关闭</button></h2>
      ${list.map(r => `<div class="border p-1 my-1 flex justify-between">
      <span>${r.time} ${r.type} ${Number(r.rmbAmount).toFixed(2)}元 ${r.category}</span>
      <button onclick="restoreRecord('${r.id}')" class="text-green-500">恢复</button>
      </div>`).join('')}
      </div></div>`;
    document.getElementById('modal').innerHTML = html;
  }

  async function restoreRecord(id) {
    const idx = state.deletedRecords.findIndex(r => r.id === id);
    if (idx === -1) return;
    const item = state.deletedRecords.splice(idx, 1)[0];
    state.records.push(item);
    await saveData();
    render();
    closeModal();
  }

  function closeModal() {
    document.getElementById('modal').innerHTML = '';
  }

  // 日历
  function renderCalendar(app) {
    const now = new Date();
    let cy = now.getFullYear(), cm = now.getMonth();

    app.innerHTML = `
      <div class="h-screen flex flex-col">
        <div class="p-2 border-b flex justify-between items-center">
          <button onclick="changeMonth(-1)">上一月</button>
          <h2 id="calTitle">${cy}年${cm + 1}月</h2>
          <button onclick="changeMonth(1)">下一月</button>
        </div>
        <div id="calGrid" class="grid grid-cols-7 gap-1 p-2 flex-1 overflow-auto"></div>
        <div id="dayRecords" class="border-t p-2 max-h-[25vh] overflow-auto"></div>
        <div class="flex border-t">
          <button onclick="switchPage('home')" class="flex-1 py-3">首页</button>
          <button onclick="switchPage('calendar')" class="flex-1 py-3 bg-blue-100">日历</button>
          <button onclick="switchPage('asset')" class="flex-1 py-3">资产</button>
          <button onclick="switchPage('setting')" class="flex-1 py-3">设置</button>
        </div>
      </div>`;

    renderCalGrid(cy, cm);
  }

  function changeMonth(delta) {
    const title = document.getElementById('calTitle').innerText;
    let [y, m] = title.match(/\d+/g).map(Number);
    m += delta;
    if (m > 11) { m = 0; y++; }
    if (m < 0) { m = 11; y--; }
    document.getElementById('calTitle').innerText = `${y}年${m + 1}月`;
    renderCalGrid(y, m);
  }

  function renderCalGrid(y, m) {
    const grid = document.getElementById('calGrid');
    const firstDay = new Date(y, m, 1).getDay();
    const totalDays = new Date(y, m + 1, 0).getDate();
    let html = '';

    for (let i = 0; i < firstDay; i++) html += `<div></div>`;
    for (let d = 1; d <= totalDays; d++) {
      const dayStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayRecs = state.records.filter(r => r.time.startsWith(dayStr));
      const sum = dayRecs.reduce((s, i) => i.type === 'expense' ? s - Number(i.rmbAmount || 0) : s + Number(i.rmbAmount || 0), 0);
      html += `<div class="border p-1 text-center cursor-pointer" onclick="showDayRec('${dayStr}')">${d}<br><span class="text-xs ${sum >= 0 ? 'text-green-600' : 'text-red-600'}">${sum.toFixed(2)}</span></div>`;
    }

    grid.innerHTML = html;
  }

  function showDayRec(dayStr) {
    const recs = state.records.filter(r => r.time.startsWith(dayStr));
    const box = document.getElementById('dayRecords');
    box.innerHTML = `<div class="font-semibold">${dayStr}记录</div>` +
      recs.map(r => `<div>${r.time} ${r.type} ${Number(r.rmbAmount).toFixed(2)}元 ${r.category} ${r.note || ''}</div>`).join('');
  }

  // 资产页
  function renderAsset(app) {
    const travelAssets = state.assets.filter(a => a.type === 'travel');
    const activityAssets = state.assets.filter(a => a.type === 'activity');

    const travelTotal = travelAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
    const travelSpend = state.records.filter(r => r.assetType === 'travel' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
    const travelRemain = travelTotal - travelSpend;

    const actTotal = activityAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
    const actSpend = state.records.filter(r => r.assetType === 'activity' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
    const actRemain = actTotal - actSpend;

    app.innerHTML = `
      <div class="h-screen flex flex-col p-2">
        <h2 class="text-lg font-bold mb-2">资产管理</h2>
        <button onclick="addAssetModal()" class="bg-blue-500 text-white py-2 rounded mb-2">新增资产</button>
        <div class="border p-2 rounded mb-2">
          <h3>差旅资产汇总(RMB)</h3>
          <p>资产总额：${travelTotal.toFixed(2)} | 总支出：${travelSpend.toFixed(2)} | 剩余：${travelRemain.toFixed(2)}</p>
          ${travelAssets.map(a => `<div>${a.name}：${Number(a.amount).toFixed(2)}</div>`).join('')}
        </div>
        <div class="border p-2 rounded mb-2">
          <h3>活动资产汇总(RMB)</h3>
          <p>资产总额：${actTotal.toFixed(2)} | 总支出：${actSpend.toFixed(2)} | 剩余：${actRemain.toFixed(2)}</p>
          ${activityAssets.map(a => `<div>${a.name}：${Number(a.amount).toFixed(2)}</div>`).join('')}
        </div>
        <div class="flex-1"></div>
        <div class="flex border-t">
          <button onclick="switchPage('home')" class="flex-1 py-3">首页</button>
          <button onclick="switchPage('calendar')" class="flex-1 py-3">日历</button>
          <button onclick="switchPage('asset')" class="flex-1 py-3 bg-blue-100">资产</button>
          <button onclick="switchPage('setting')" class="flex-1 py-3">设置</button>
        </div>
      </div>`;
  }

  function addAssetModal() {
    const html = `
      <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded p-4">
          <h3 class="font-bold mb-2">新增资产</h3>
          <input class="border w-full p-2 mb-2" id="assetName" placeholder="资产名称">
          <input class="border w-full p-2 mb-2" id="assetAmt" placeholder="金额RMB" type="number">
          <select id="assetType" class="border w-full p-2 mb-2">
            <option value="travel">差旅资产</option>
            <option value="activity">活动资产</option>
          </select>
          <div class="flex gap-2">
            <button onclick="saveAsset()" class="flex-1 bg-blue-500 text-white py-2 rounded">保存</button>
            <button onclick="closeModal()" class="flex-1 bg-gray-400 text-white py-2 rounded">取消</button>
          </div>
        </div>
      </div>`;

    document.getElementById('modal').innerHTML = html;
  }

  async function saveAsset() {
    const name = document.getElementById('assetName').value;
    const amount = Number(document.getElementById('assetAmt').value);
    const type = document.getElementById('assetType').value;

    state.assets.push({
      id: genId(),
      name,
      amount,
      type,
      createTime: new Date().toLocaleString()
    });

    await saveData();
    closeModal();
    render();
  }

  // 设置页
  function renderSetting(app) {
    const currHtml = state.currencies.map((c, idx) => `
      <div class="border p-2 my-1 flex items-center gap-2">
        <input type="radio" name="defCurr" ${c.isDefault ? 'checked' : ''} onchange="setDefaultCurr(${idx})">
        <span>${c.code}：${c.rate} （1${c.code}=${c.rate} RMB）</span>
        <button onclick="delCurr(${idx})" class="text-red-500">删除</button>
      </div>`).join('');

    app.innerHTML = `
      <div class="h-screen flex flex-col p-2">
        <h2 class="text-lg font-bold mb-2">设置</h2>
        <div class="border p-2 rounded mb-2">
          <h3 class="font-semibold">币种管理</h3>
          ${currHtml}
          <div class="grid grid-cols-3 gap-2 mt-2">
            <input id="newCode" placeholder="币种代码USD" class="border p-2">
            <input id="newRate" placeholder="汇率 1外币=多少RMB" class="border p-2" type="number">
            <button onclick="addCurrency()" class="bg-blue-500 text-white rounded">添加</button>
          </div>
        </div>
        <div class="flex-1"></div>
        <div class="flex border-t">
          <button onclick="switchPage('home')" class="flex-1 py-3">首页</button>
          <button onclick="switchPage('calendar')" class="flex-1 py-3">日历</button>
          <button onclick="switchPage('asset')" class="flex-1 py-3">资产</button>
          <button onclick="switchPage('setting')" class="flex-1 py-3 bg-blue-100">设置</button>
        </div>
      </div>`;
  }

  async function addCurrency() {
    const code = document.getElementById('newCode').value.trim().toUpperCase();
    const rate = Number(document.getElementById('newRate').value);

    if (!code || isNaN(rate)) {
      alert('填写币种和汇率');
      return;
    }

    state.currencies.push({ code, rate, isDefault: false });
    await saveData();
    render();
  }

  async function setDefaultCurr(idx) {
    state.currencies.forEach((c, i) => c.isDefault = i === idx);
    await saveData();
    render();
  }

  async function delCurr(idx) {
    state.currencies.splice(idx, 1);
    await saveData();
    render();
  }

  // 初始化
  async function init() {
    await loadAllLocal();
    render();
  }

  // 暴露给 onclick 使用
  window.switchPage = switchPage;
  window.openBillPage = openBillPage;
  window.calcRmb = calcRmb;
  window.submitBill = submitBill;
  window.closeBillModal = closeBillModal;
  window.delRecord = delRecord;
  window.editRecord = editRecord;
  window.showAllRecords = showAllRecords;
  window.showRecycleBin = showRecycleBin;
  window.restoreRecord = restoreRecord;
  window.closeModal = closeModal;
  window.changeMonth = changeMonth;
  window.showDayRec = showDayRec;
  window.addAssetModal = addAssetModal;
  window.saveAsset = saveAsset;
  window.addCurrency = addCurrency;
  window.setDefaultCurr = setDefaultCurr;
  window.delCurr = delCurr;

  init();
</script>

</script>
</html>
