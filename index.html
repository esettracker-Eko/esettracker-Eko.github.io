<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>差旅记账本（离线本地版）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f9; color: #222; }
  #app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
  .page { padding-bottom: 70px; }
  .header { padding: 14px 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  .header h2 { font-size: 17px; }
  .btn { border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-gray { background: #9ca3af; color: #fff; }
  .btn-text { background: transparent; color: #2563eb; padding: 6px 8px; }
  .btn-danger { color: #dc2626; background: transparent; }
  .btn-success { color: #16a34a; background: transparent; }
  .card { margin: 12px 16px; padding: 14px; border-radius: 12px; background: #f3f4f6; }
  .card h3 { font-size: 15px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 99; padding: 16px; }
  .modal { background: #fff; width: 100%; max-width: 420px; border-radius: 14px; padding: 16px; }
  .modal h3 { margin-bottom: 12px; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  .radio-group { display: flex; gap: 14px; margin-bottom: 10px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #fff; border-top: 1px solid #eee; display: flex; z-index: 10; }
  .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 14px; cursor: pointer; border: none; background: transparent; }
  .tab.active { color: #2563eb; font-weight: 600; }
  .record-list { padding: 12px 16px; }
  .record-item { background: #f9fafb; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .record-item .top { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
  .record-item .note { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .amount-red { color: #dc2626; font-weight: 600; }
  .amount-green { color: #16a34a; font-weight: 600; }
  .section-title { padding: 14px 16px 6px; font-size: 15px; font-weight: 600; }
  .summary-grid { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .summary-box { background: #f3f4f6; border-radius: 12px; padding: 12px; }
  .summary-box .label { font-size: 13px; color: #4b5563; margin-bottom: 6px; }
  .summary-box .value { font-size: 14px; margin-bottom: 4px; }
  .calendar { padding: 12px 16px; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-day { aspect-ratio: 1; border-radius: 10px; background: #f3f4f6; padding: 6px; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
  .cal-day.empty { background: transparent; }
  .cal-day .num { font-weight: 600; }
  .cal-day .money { font-size: 11px; }
  .day-records { padding: 12px 16px; border-top: 1px solid #eee; max-height: 26vh; overflow: auto; }
  .coin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f9fafb; border-radius: 10px; margin-bottom: 8px; }
  .coin-item label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .empty { padding: 40px 16px; text-align: center; color: #9ca3af; font-size: 14px; }
  .float-right { float: right; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
const state = {
  currentPage: 'home',
  records: [],
  deletedRecords: [],
  assets: [],
  currencies: []
};

const DB_NAME = 'travelBillDB';
const STORE_NAME = 'main';
let idb;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      idb = e.target.result;
      idb.createObjectStore(STORE_NAME);
    };
    req.onsuccess = e => { idb = e.target.result; res(idb); };
    req.onerror = e => rej(e.target.error);
  });
}

async function idbSave(key, data) {
  await openDB();
  const tx = idb.transaction(STORE_NAME, 'readwrite');
  tx.objectStore(STORE_NAME).put(data, key);
}

async function idbLoad(key) {
  await openDB();
  const tx = idb.transaction(STORE_NAME, 'readonly');
  return tx.objectStore(STORE_NAME).get(key);
}

async function saveAll() {
  await idbSave('records', state.records);
  await idbSave('deletedRecords', state.deletedRecords);
  await idbSave('assets', state.assets);
  await idbSave('currencies', state.currencies);
}

async function loadAll() {
  state.records = await idbLoad('records') || [];
  state.deletedRecords = await idbLoad('deletedRecords') || [];
  state.assets = await idbLoad('assets') || [];
  state.currencies = await idbLoad('currencies') || [{ code: 'CNY', rate: 1, isDefault: true }];
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function fmt(n) {
  return Number(n || 0).toFixed(2);
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;

  if (state.currentPage === 'home') renderHome(app);
  else if (state.currentPage === 'calendar') renderCalendar(app);
  else if (state.currentPage === 'asset') renderAsset(app);
  else if (state.currentPage === 'setting') renderSetting(app);
}

function switchPage(page) {
  state.currentPage = page;
  render();
}

function renderHome(app) {
  const travelAssets = state.assets.filter(a => a.type === 'travel');
  const activityAssets = state.assets.filter(a => a.type === 'activity');

  const travelTotal = travelAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
  const travelSpend = state.records.filter(r => r.assetType === 'travel' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
  const travelRemain = travelTotal - travelSpend;

  const actTotal = activityAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
  const actSpend = state.records.filter(r => r.assetType === 'activity' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
  const actRemain = actTotal - actSpend;

  const list = [...state.records].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 8);

  app.innerHTML = `
    <div class="page">
      <div class="header">
        <h2>首页</h2>
        <button class="btn-text" onclick="showAllRecords()">所有明细</button>
      </div>

      <div class="summary-grid">
        <div class="summary-box">
          <div class="label">差旅资产</div>
          <div class="value">总额：${fmt(travelTotal)} RMB</div>
          <div class="value">已支出：${fmt(travelSpend)} RMB</div>
          <div class="value">剩余：${fmt(travelRemain)} RMB</div>
        </div>
        <div class="summary-box">
          <div class="label">活动资产</div>
          <div class="value">总额：${fmt(actTotal)} RMB</div>
          <div class="value">已支出：${fmt(actSpend)} RMB</div>
          <div class="value">剩余：${fmt(actRemain)} RMB</div>
        </div>
      </div>

      <div style="padding:0 16px;">
        <button class="btn btn-primary" style="width:100%;" onclick="openBillPage()">开始记账</button>
      </div>

      <div class="section-title">最近明细</div>
      <div class="record-list">
        ${list.length === 0 ? '<div class="empty">暂无记录</div>' : list.map(r => `
          <div class="record-item">
            <div class="top">
              <span>${r.time}</span>
              <span class="${r.type === 'expense' ? 'amount-red' : 'amount-green'}">${r.type === 'expense' ? '-' : '+'}${fmt(r.rmbAmount)} 元</span>
            </div>
            <div>${r.category} · ${r.currency} ${fmt(r.amount)}</div>
            ${r.note ? `<div class="note">${r.note}</div>` : ''}
            <div style="margin-top:8px;">
              <button class="btn-text" onclick="editRecord('${r.id}')">修改</button>
              <button class="btn-danger" onclick="delRecord('${r.id}')">删除</button>
            </div>
          </div>
        `).join('')}
      </div>

      <div style="padding:0 16px 16px;">
        <button class="btn btn-text" style="width:100%;" onclick="showRecycleBin()">回收站</button>
      </div>

      ${renderTabs('home')}
    </div>`;
}

function renderTabs(active) {
  return `
    <div class="tabs">
      <button class="tab ${active==='home'?'active':''}" onclick="switchPage('home')">首页</button>
      <button class="tab ${active==='calendar'?'active':''}" onclick="switchPage('calendar')">日历</button>
      <button class="tab ${active==='asset'?'active':''}" onclick="switchPage('asset')">资产</button>
      <button class="tab ${active==='setting'?'active':''}" onclick="switchPage('setting')">设置</button>
    </div>`;
}

function openBillPage() {
  const assetTypes = state.assets.length
    ? state.assets.map(a => `<option value="${a.type}">${a.name || a.type}</option>`).join('')
    : '<option value="travel">差旅资产</option><option value="activity">活动资产</option>';

  const currencyOpts = state.currencies.map(c => `<option value="${c.code}" data-rate="${c.rate}">${c.code}</option>`).join('');

  const catOpts = `
    <option>交通-飞机</option>
    <option>交通-火车</option>
    <option>交通-出租</option>
    <option>交通-租车</option>
    <option>交通-停车费</option>
    <option>交通-公共交通</option>
    <option>交通-加油</option>
    <option>住宿</option>
    <option>餐饮-早餐</option>
    <option>餐饮-中餐</option>
    <option>餐饮-晚餐</option>
    <option>餐饮-夜宵</option>
    <option>餐饮-咖啡饮品</option>
    <option>招待-餐饮</option>
    <option>招待-娱乐</option>
    <option>招待-礼物</option>
    <option>招待-其他</option>
    <option>通讯-话费</option>
    <option>通讯-网络</option>
    <option>其他</option>`;

  document.getElementById('modal').innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>记一笔</h3>
        <div class="radio-group">
          <label><input type="radio" name="billType" value="expense" checked> 支出</label>
          <label><input type="radio" name="billType" value="income"> 收入</label>
        </div>
        <div class="grid-3">
          <input type="number" id="billAmount" placeholder="金额" />
          <select id="billAssetType">${assetTypes}</select>
          <select id="billCurrency" onchange="calcRmb()">${currencyOpts}</select>
        </div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:10px;">RMB：<span id="rmbPreview">0</span></div>
        <select id="billCategory">${catOpts}</select>
        <textarea id="billNote" placeholder="备注"></textarea>
        <div class="grid-2">
          <button class="btn btn-primary" onclick="submitBill()">保存</button>
          <button class="btn btn-gray" onclick="closeBillModal()">取消</button>
        </div>
      </div>
    </div>`;
}

function calcRmb() {
  const amount = Number(document.getElementById('billAmount').value || 0);
  const sel = document.getElementById('billCurrency');
  const rate = Number(sel.options[sel.selectedIndex].dataset.rate);
  document.getElementById('rmbPreview').textContent = fmt(amount * rate);
}

async function submitBill() {
  const type = document.querySelector('input[name="billType"]:checked').value;
  const amount = Number(document.getElementById('billAmount').value);
  const assetType = document.getElementById('billAssetType').value;
  const currency = document.getElementById('billCurrency').value;
  const category = document.getElementById('billCategory').value;
  const note = document.getElementById('billNote').value;

  const curr = state.currencies.find(c => c.code === currency);
  const rmbAmount = amount * curr.rate;

  state.records.push({
    id: genId(),
    time: new Date().toLocaleString(),
    type, amount, currency, rmbAmount, assetType, category, note
  });

  await saveAll();
  closeBillModal();
  render();
}

function closeBillModal() {
  document.getElementById('modal').innerHTML = '';
}

async function delRecord(id) {
  const idx = state.records.findIndex(r => r.id === id);
  if (idx === -1) return;
  state.deletedRecords.push(state.records.splice(idx, 1)[0]);
  await saveAll();
  render();
}

function editRecord(id) {
  alert('编辑功能暂未开放');
}

function showAllRecords() {
  const all = [...state.records].sort((a, b) => new Date(b.time) - new Date(a.time));
  document.getElementById('modal').innerHTML = `
    <div class="modal-mask">
      <div class="modal" style="max-height:80vh;overflow:auto;">
        <h3>全部明细 <button class="btn-text float-right" onclick="closeModal()">关闭</button></h3>
        ${all.length === 0 ? '<div class="empty">暂无记录</div>' : all.map(r => `
          <div class="record-item">
            <div class="top"><span>${r.time}</span><span>${r.type} ${fmt(r.rmbAmount)} 元</span></div>
            <div>${r.category} · ${r.currency} ${fmt(r.amount)}</div>
            ${r.note ? `<div class="note">${r.note}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>`;
}

function showRecycleBin() {
  document.getElementById('modal').innerHTML = `
    <div class="modal-mask">
      <div class="modal" style="max-height:80vh;overflow:auto;">
        <h3>回收站 <button class="btn-text float-right" onclick="closeModal()">关闭</button></h3>
        ${state.deletedRecords.length === 0 ? '<div class="empty">暂无删除记录</div>' : state.deletedRecords.map(r => `
          <div class="record-item">
            <div class="top"><span>${r.time}</span><span>${r.type} ${fmt(r.rmbAmount)} 元</span></div>
            <div>${r.category}</div>
            <button class="btn-success" onclick="restoreRecord('${r.id}')">恢复</button>
          </div>
        `).join('')}
      </div>
    </div>`;
}

async function restoreRecord(id) {
  const idx = state.deletedRecords.findIndex(r => r.id === id);
  if (idx === -1) return;
  state.records.push(state.deletedRecords.splice(idx, 1)[0]);
  await saveAll();
  render();
  closeModal();
}

function closeModal() {
  document.getElementById('modal').innerHTML = '';
}

function renderCalendar(app) {
  const now = new Date();
  let cy = now.getFullYear(), cm = now.getMonth();

  app.innerHTML = `
    <div class="page">
      <div class="header">
        <button class="btn-text" onclick="changeMonth(-1)">上一月</button>
        <h2 id="calTitle">${cy}年${cm + 1}月</h2>
        <button class="btn-text" onclick="changeMonth(1)">下一月</button>
      </div>
      <div class="calendar" id="calContainer"></div>
      <div class="day-records" id="dayRecords"></div>
      ${renderTabs('calendar')}
    </div>`;

  renderCalGrid(cy, cm);
}

function changeMonth(delta) {
  const title = document.getElementById('calTitle').innerText;
  let [y, m] = title.match(/\d+/g).map(Number);
  m += delta;
  if (m > 11) { m = 0; y++; }
  if (m < 0) { m = 11; y--; }
  document.getElementById('calTitle').innerText = `${y}年${m + 1}月`;
  renderCalGrid(y, m);
}

function renderCalGrid(y, m) {
  const container = document.getElementById('calContainer');
  if (!container) return;

  const firstDay = new Date(y, m, 1).getDay();
  const totalDays = new Date(y, m + 1, 0).getDate();

  let html = '<div class="cal-grid">';
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= totalDays; d++) {
    const dayStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayRecs = state.records.filter(r => r.time.startsWith(dayStr));
    const sum = dayRecs.reduce((s, i) => i.type === 'expense' ? s - Number(i.rmbAmount || 0) : s + Number(i.rmbAmount || 0), 0);

    html += `
      <div class="cal-day" onclick="showDayRec('${dayStr}')">
        <span class="num">${d}</span>
        <span class="money ${sum >= 0 ? 'amount-green' : 'amount-red'}">${fmt(sum)}</span>
      </div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

function showDayRec(dayStr) {
  const recs = state.records.filter(r => r.time.startsWith(dayStr));
  const box = document.getElementById('dayRecords');
  box.innerHTML = `
    <div style="font-weight:600;margin-bottom:8px;">${dayStr} 记录</div>
    ${recs.length === 0 ? '<div class="empty">当天无记录</div>' : recs.map(r => `
      <div class="record-item">
        <div class="top"><span>${r.time}</span><span>${r.type} ${fmt(r.rmbAmount)} 元</span></div>
        <div>${r.category} · ${r.currency} ${fmt(r.amount)}</div>
        ${r.note ? `<div class="note">${r.note}</div>` : ''}
      </div>
    `).join('')}`;
}

function renderAsset(app) {
  const travelAssets = state.assets.filter(a => a.type === 'travel');
  const activityAssets = state.assets.filter(a => a.type === 'activity');

  const travelTotal = travelAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
  const travelSpend = state.records.filter(r => r.assetType === 'travel' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
  const travelRemain = travelTotal - travelSpend;

  const actTotal = activityAssets.reduce((s, i) => s + Number(i.amount || 0), 0);
  const actSpend = state.records.filter(r => r.assetType === 'activity' && r.type === 'expense').reduce((s, i) => s + Number(i.rmbAmount || 0), 0);
  const actRemain = actTotal - actSpend;

  app.innerHTML = `
    <div class="page">
      <div class="header"><h2>资产管理</h2></div>
      <div style="padding:0 16px;">
        <button class="btn btn-primary" style="width:100%;" onclick="addAssetModal()">新增资产</button>
      </div>

      <div class="card">
        <h3>差旅资产汇总</h3>
        <div class="row"><span>总额</span><span>${fmt(travelTotal)} RMB</span></div>
        <div class="row"><span>已支出</span><span>${fmt(travelSpend)} RMB</span></div>
        <div class="row"><span>剩余</span><span>${fmt(travelRemain)} RMB</span></div>
        ${travelAssets.map(a => `<div class="row"><span>${a.name}</span><span>${fmt(a.amount)}</span></div>`).join('')}
      </div>

      <div class="card">
        <h3>活动资产汇总</h3>
        <div class="row"><span>总额</span><span>${fmt(actTotal)} RMB</span></div>
        <div class="row"><span>已支出</span><span>${fmt(actSpend)} RMB</span></div>
        <div class="row"><span>剩余</span><span>${fmt(actRemain)} RMB</span></div>
        ${activityAssets.map(a => `<div class="row"><span>${a.name}</span><span>${fmt(a.amount)}</span></div>`).join('')}
      </div>

      ${renderTabs('asset')}
    </div>`;
}

function addAssetModal() {
  document.getElementById('modal').innerHTML = `
    <div class="modal-mask">
      <div class="modal">
        <h3>新增资产</h3>
        <input id="assetName" placeholder="资产名称" />
        <input id="assetAmt" type="number" placeholder="金额 RMB" />
        <select id="assetType">
          <option value="travel">差旅资产</option>
          <option value="activity">活动资产</option>
        </select>
        <div class="grid-2">
          <button class="btn btn-primary" onclick="saveAsset()">保存</button>
          <button class="btn btn-gray" onclick="closeModal()">取消</button>
        </div>
      </div>
    </div>`;
}

async function saveAsset() {
  const name = document.getElementById('assetName').value;
  const amount = Number(document.getElementById('assetAmt').value);
  const type = document.getElementById('assetType').value;

  state.assets.push({ id: genId(), name, amount, type });
  await saveAll();
  closeModal();
  render();
}

function renderSetting(app) {
  app.innerHTML = `
    <div class="page">
      <div class="header"><h2>设置</h2></div>

      <div class="card">
        <h3>币种管理</h3>
        ${state.currencies.map((c, idx) => `
          <div class="coin-item">
            <label><input type="radio" name="defCurr" ${c.isDefault ? 'checked' : ''} onchange="setDefaultCurr(${idx})"> ${c.code} · 1${c.code}=${c.rate} RMB</label>
            <button class="btn-danger" onclick="delCurr(${idx})">删除</button>
          </div>
        `).join('')}

        <div class="grid-3" style="margin-top:10px;">
          <input id="newCode" placeholder="币种代码" />
          <input id="newRate" type="number" placeholder="汇率" />
          <button class="btn btn-primary" onclick="addCurrency()">添加</button>
        </div>
      </div>

      ${renderTabs('setting')}
    </div>`;
}

async function addCurrency() {
  const code = document.getElementById('newCode').value.trim().toUpperCase();
  const rate = Number(document.getElementById('newRate').value);
  if (!code || isNaN(rate)) { alert('请填写币种和汇率'); return; }
  state.currencies.push({ code, rate, isDefault: false });
  await saveAll();
  render();
}

async function setDefaultCurr(idx) {
  state.currencies.forEach((c, i) => c.isDefault = i === idx);
  await saveAll();
  render();
}

async function delCurr(idx) {
  state.currencies.splice(idx, 1);
  await saveAll();
  render();
}

// 把所有函数挂载到全局
window.switchPage = switchPage;
window.openBillPage = openBillPage;
